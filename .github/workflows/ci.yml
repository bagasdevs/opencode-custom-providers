name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Coverage runs once; the other matrix leg still executes the same suite.
      - run: npm run test:src
        if: matrix.node != 22
      - run: npm run test:coverage
        if: matrix.node == 22
      - run: npm run typecheck:tests
      - run: npm run lint

  # The bundles are what postinstall copies into a plugins dir, so a stale
  # bundles/ ships old code even when src/ is correct.
  bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run bundles
      - name: bundles/ matches src/
        run: |
          git diff --exit-code -- bundles
          test -z "$(git ls-files --others --exclude-standard -- bundles)"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm audit --audit-level=high
